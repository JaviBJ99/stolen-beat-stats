<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stolen Beat · Stats</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d0d0d; --surface: #181818; --surface2: #222; --border: #2e2e2e;
    --text: #f0f0f0; --muted: #777; --red: #b03020; --red-dim: #7a1f12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 1rem; padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); background: #ffffff; }
  header img { height: 72px; width: 72px; object-fit: contain; }
  header h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #111; }
  header h1 span { color: var(--red); }
  .header-right { margin-left: auto; }
  .total-badge { background: var(--red); color: white; border-radius: 6px; padding: 4px 12px; font-size: 0.8rem; font-weight: 600; }
  .channel-banner { margin: 1.5rem 2rem 0; background: #111; border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .channel-banner p { font-size: 0.85rem; color: var(--muted); }
  .channel-banner a { display: inline-flex; align-items: center; gap: 6px; background: var(--red); color: white; border-radius: 6px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; text-decoration: none; white-space: nowrap; transition: opacity 0.15s; }
  .channel-banner a:hover { opacity: 0.85; }
  .channel-banner svg { width: 14px; height: 14px; }
  .disco-del-dia { margin: 1rem 2rem 0; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--red); border-radius: 10px; padding: 1.2rem 1.5rem; cursor: pointer; transition: background 0.15s; display: flex; gap: 1.2rem; align-items: center; }
  .disco-del-dia:hover { background: #1e1e1e; }
  .disco-del-dia img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .disco-del-dia .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--red); font-weight: 600; margin-bottom: 4px; }
  .disco-del-dia .title { font-size: 1rem; font-weight: 700; }
  .disco-del-dia .meta { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }
  .disco-del-dia .genres { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .disco-del-dia .hint { font-size: 0.75rem; color: var(--red); margin-top: 8px; }
  nav { display: flex; border-bottom: 1px solid var(--border); padding: 0 2rem; overflow-x: auto; margin-top: 1rem; }
  nav button { background: none; border: none; color: var(--muted); padding: 12px 16px; cursor: pointer; font-size: 0.85rem; font-weight: 500; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; }
  nav button.active { color: var(--text); border-bottom-color: var(--red); }
  nav button:hover:not(.active) { color: var(--text); }
  .section { display: none; padding: 1.5rem 2rem; max-width: 1000px; }
  .section.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .card h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1.2rem; font-weight: 600; }
  .search-box { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.15s; }
  .search-box:focus { border-color: var(--red); }
  .search-box::placeholder { color: var(--muted); }
  .results { margin-top: 1rem; }
  .result-count { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
  .result-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 1rem; }
  .result-item:last-child { border-bottom: none; }
  .result-main { font-size: 0.9rem; min-width: 0; }
  .result-main strong { color: var(--text); }
  .result-main .album { color: var(--muted); }
  .result-genres { font-size: 0.75rem; color: var(--red); margin-top: 3px; }
  .result-year { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .no-results, .hint { color: var(--muted); font-size: 0.9rem; padding: 1rem 0; }
  .genre-tags { display: flex; flex-wrap: wrap; gap: 8px; transition: all 0.2s; }
  .genre-tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; color: var(--text); }
  .genre-tag:hover { border-color: var(--red); color: var(--red); }
  .genre-tag.active { background: var(--red); border-color: var(--red); color: white; }
  .genre-search { margin-bottom: 1rem; }
  .subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 1.2rem; overflow-x: auto; }
  .subtab { background: none; border: none; color: var(--muted); padding: 8px 16px; cursor: pointer; font-size: 0.8rem; font-weight: 500; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; }
  .subtab.active { color: var(--text); border-bottom-color: var(--red); }
  .subtab:hover:not(.active) { color: var(--text); }
  .subsection { display: none; }
  .subsection.active { display: block; }
  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; max-width: 480px; width: 90%; position: relative; }
  .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }
  .modal-close:hover { color: var(--text); }
  .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
  .modal-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .modal-genres { font-size: 0.8rem; color: var(--red); margin-bottom: 1.2rem; }
  .modal-links { display: flex; flex-direction: column; gap: 8px; }
  .modal-link { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; text-decoration: none; color: var(--text); font-size: 0.85rem; transition: border-color 0.15s; }
  .modal-link:hover { border-color: var(--red); color: var(--red); }
  .modal-link span { color: var(--muted); font-size: 0.75rem; }
  .modal-no-links { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-meta" id="modalMeta"></div>
    <div class="modal-genres" id="modalGenres"></div>
    <div class="modal-links" id="modalLinks"></div>
  </div>
</div>

// Modal
const PLATFORM_LABELS = {
  bandcamp: 'Bandcamp', spotify: 'Spotify', appleMusic: 'Apple Music',
  tidal: 'Tidal', amazonMusic: 'Amazon Music', youtubeMusic: 'YouTube Music'
};

function openModalForDisco(d) {
  if (!d) return;
  document.getElementById('modalTitle').textContent = d.artist + ' — ' + d.album;
  document.getElementById('modalMeta').textContent = d.year || '—';
  document.getElementById('modalGenres').textContent = d.genres.join(' · ');
  const links = d.links || {};
  const keys = Object.keys(links);
  document.getElementById('modalLinks').innerHTML = keys.length
    ? keys.map(k => `<a class="modal-link" href="${links[k]}" target="_blank">${PLATFORM_LABELS[k] || k}<span>→</span></a>`).join('')
    : '<p class="modal-no-links">No links available</p>';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay') || e.currentTarget.classList.contains('modal-close')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal({target: document.getElementById('modalOverlay')}); });

function showSubtab(id, btn) {
  const parent = btn.closest('.section');
  parent.querySelectorAll('.subsection').forEach(s => s.classList.remove('active'));
  parent.querySelectorAll('.subtab').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function showTab(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function searchDiscos(q) {
  const results = document.getElementById('resultsDiscos');
  q = q.trim().toLowerCase();
  if (q.length < 2) { results.innerHTML = '<p class="hint">Type at least 2 characters</p>'; return; }
  const matches = DATA.discos.filter(d => d.artist.toLowerCase().includes(q) || d.album.toLowerCase().includes(q));
  if (!matches.length) { results.innerHTML = '<p class="no-results">No results</p>'; return; }
  results.innerHTML = `<p class="result-count">${matches.length} result${matches.length !== 1 ? 's' : ''}</p>` +
    matches.slice(0, 50).map(d => `
      <div class="result-item" style="cursor:pointer" onclick='openModalForDisco(${JSON.stringify(d)})'>
        <div class="result-main">
          <strong>${d.artist}</strong> <span class="album">- ${d.album}</span>
          ${d.genres.length ? `<div class="result-genres">${d.genres.slice(0,4).join(' · ')}</div>` : ''}
        </div>
        <div class="result-year">${d.year || '—'}</div>
      </div>`).join('');
}

// Search by genre
let activeGenre = null;

function renderGenreTags(filter) {
  const container = document.getElementById('genreTags');
  if (activeGenre) {
    // Solo mostrar la etiqueta activa
    container.innerHTML = `<span class="genre-tag active" onclick="selectGenre('${activeGenre.replace(/'/g, "\'")}')">${activeGenre} <span style="opacity:0.5">✕</span></span>`;
    return;
  }
  const genres = filter
    ? DATA.all_genres.filter(g => g.name.toLowerCase().includes(filter.toLowerCase()))
    : DATA.all_genres;
  container.innerHTML = genres.slice(0, 100).map(g =>
    `<span class="genre-tag" onclick="selectGenre('${g.name.replace(/'/g, "\'")}')">${g.name} <span style="opacity:0.5">${g.count}</span></span>`
  ).join('');
}

function filterGenres(q) {
  activeGenre = null;
  document.getElementById('resultsGenre').innerHTML = '';
  renderGenreTags(q);
}

function selectGenre(name) {
  if (activeGenre === name) {
    // Deseleccionar
    activeGenre = null;
    document.getElementById('resultsGenre').innerHTML = '';
    renderGenreTags(document.getElementById('genreFilter').value);
    return;
  }
  activeGenre = name;
  renderGenreTags('');
  const matches = DATA.discos.filter(d => d.genres.some(g => g.toLowerCase() === name.toLowerCase()));
  const results = document.getElementById('resultsGenre');
  if (!matches.length) { results.innerHTML = '<p class="no-results">No albums with this genre</p>'; return; }
  results.innerHTML = `<p class="result-count">${matches.length} album${matches.length !== 1 ? 's' : ''} with <strong>${name}</strong></p>` +
    matches.map(d => `
      <div class="result-item" style="cursor:pointer" onclick='openModalForDisco(${JSON.stringify(d)})'>
        <div class="result-main">
          <strong>${d.artist}</strong> <span class="album">- ${d.album}</span>
          ${d.genres.length ? `<div class="result-genres">${d.genres.filter(g=>g!==name).slice(0,3).join(' · ')}</div>` : ''}
        </div>
        <div class="result-year">${d.year || '—'}</div>
      </div>`).join('');
}

renderGenreTags('');
</script>
</body>
