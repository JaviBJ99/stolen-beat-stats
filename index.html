<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stolen Beat · Stats</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d0d0d; --surface: #181818; --surface2: #222; --border: #2e2e2e;
    --text: #f0f0f0; --muted: #777; --red: #b03020; --red-dim: #7a1f12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  header { display: flex; align-items: center; gap: 1rem; padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); background: #ffffff; }
  header img { height: 72px; width: 72px; object-fit: contain; }
  header h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #111; }
  header h1 span { color: var(--red); }
  .header-right { margin-left: auto; }
  .total-badge { background: var(--red); color: white; border-radius: 6px; padding: 4px 12px; font-size: 0.8rem; font-weight: 600; }
  .disco-del-dia { margin: 1.5rem 2rem; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--red); border-radius: 10px; padding: 1.2rem 1.5rem; }
  .disco-del-dia .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--red); font-weight: 600; margin-bottom: 4px; }
  .disco-del-dia .title { font-size: 1rem; font-weight: 700; }
  .disco-del-dia .meta { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }
  .disco-del-dia .genres { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  nav { display: flex; border-bottom: 1px solid var(--border); padding: 0 2rem; overflow-x: auto; }
  nav button { background: none; border: none; color: var(--muted); padding: 12px 16px; cursor: pointer; font-size: 0.85rem; font-weight: 500; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; }
  nav button.active { color: var(--text); border-bottom-color: var(--red); }
  nav button:hover:not(.active) { color: var(--text); }
  .section { display: none; padding: 1.5rem 2rem; max-width: 1000px; }
  .section.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .card h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1.2rem; font-weight: 600; }
  .search-box { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.15s; }
  .search-box:focus { border-color: var(--red); }
  .search-box::placeholder { color: var(--muted); }
  .results { margin-top: 1rem; }
  .result-count { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
  .result-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 1rem; }
  .result-item:last-child { border-bottom: none; }
  .result-main { font-size: 0.9rem; min-width: 0; }
  .result-main strong { color: var(--text); }
  .result-main .album { color: var(--muted); }
  .result-genres { font-size: 0.75rem; color: var(--red); margin-top: 3px; }
  .result-year { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .no-results, .hint { color: var(--muted); font-size: 0.9rem; padding: 1rem 0; }
  .genre-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .genre-tag { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 0.8rem; cursor: pointer; transition: all 0.15s; color: var(--text); }
  .genre-tag:hover { border-color: var(--red); color: var(--red); }
  .genre-tag.active { background: var(--red); border-color: var(--red); color: white; }
  .genre-search { margin-bottom: 1rem; }
</style>
</head>

  document.getElementById('discoDia').innerHTML = `

function showTab(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active'); btn.classList.add('active');
}
Chart.defaults.color='#777'; Chart.defaults.borderColor='#2e2e2e';
Chart.defaults.font.family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
new Chart(document.getElementById('chartDecadas'),{type:'bar',data:{labels:DATA.decades.map(d=>d.decade),datasets:[{data:DATA.decades.map(d=>d.count),backgroundColor:'#b03020',borderRadius:4,borderSkipped:false}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw} albums`}}},scales:{y:{grid:{color:'#222'},ticks:{precision:0}},x:{grid:{display:false}}}}});
new Chart(document.getElementById('chartGeneros'),{type:'bar',data:{labels:DATA.genres.map(g=>g.name),datasets:[{data:DATA.genres.map(g=>g.count),backgroundColor:'#b03020',borderRadius:4,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw} albums`}}},scales:{x:{grid:{color:'#222'},ticks:{precision:0}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});
new Chart(document.getElementById('chartArtistas'),{type:'bar',data:{labels:DATA.artists.map(a=>a.name),datasets:[{data:DATA.artists.map(a=>a.count),backgroundColor:'#b03020',borderRadius:4,borderSkipped:false}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw} albums`}}},scales:{x:{grid:{color:'#222'},ticks:{precision:0}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});
function searchDiscos(q){
  const results=document.getElementById('resultsDiscos');
  q=q.trim().toLowerCase();
  if(q.length<2){results.innerHTML='<p class="hint">Type at least 2 characters</p>';return;}
  const matches=DATA.discos.filter(d=>d.artist.toLowerCase().includes(q)||d.album.toLowerCase().includes(q));
  if(!matches.length){results.innerHTML='<p class="no-results">No results</p>';return;}
  results.innerHTML=`<p class="result-count">${matches.length} result${matches.length!==1?'s':''}</p>`+
    matches.slice(0,50).map(d=>`<div class="result-item"><div class="result-main"><strong>${d.artist}</strong> <span class="album">- ${d.album}</span>${d.genres.length?`<div class="result-genres">${d.genres.slice(0,4).join(' · ')}</div>`:''}</div><div class="result-year">${d.year||'—'}</div></div>`).join('');
}
let activeGenre=null;
function renderGenreTags(filter){
  const container=document.getElementById('genreTags');
  const genres=filter?DATA.all_genres.filter(g=>g.name.toLowerCase().includes(filter.toLowerCase())):DATA.all_genres;
  container.innerHTML=genres.slice(0,100).map(g=>
    `<span class="genre-tag${activeGenre===g.name?' active':''}" onclick="selectGenre('${g.name.replace(/'/g,"\'")}')">${g.name} <span style="opacity:0.5">${g.count}</span></span>`
  ).join('');
}
function filterGenres(q){activeGenre=null;document.getElementById('resultsGenre').innerHTML='';renderGenreTags(q);}
function selectGenre(name){
  activeGenre=name; renderGenreTags(document.getElementById('genreFilter').value);
  const matches=DATA.discos.filter(d=>d.genres.some(g=>g.toLowerCase()===name.toLowerCase()));
  const results=document.getElementById('resultsGenre');
  if(!matches.length){results.innerHTML='<p class="no-results">No albums with this genre</p>';return;}
  results.innerHTML=`<p class="result-count">${matches.length} album${matches.length!==1?'s':''} with <strong>${name}</strong></p>`+
    matches.map(d=>`<div class="result-item"><div class="result-main"><strong>${d.artist}</strong> <span class="album">- ${d.album}</span>${d.genres.length?`<div class="result-genres">${d.genres.filter(g=>g!==name).slice(0,3).join(' · ')}</div>`:''}</div><div class="result-year">${d.year||'—'}</div></div>`).join('');
}
renderGenreTags('');
