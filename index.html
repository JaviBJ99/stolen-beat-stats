function search(q){
  const results=document.getElementById('results');
  q=q.trim().toLowerCase();
  if(q.length<2){results.innerHTML='<p class="hint">Escribe al menos 2 caracteres para buscar</p>';return;}
  const matches=DATA.discos.filter(d=>d.artist.toLowerCase().includes(q)||d.album.toLowerCase().includes(q));
  if(!matches.length){results.innerHTML='<p class="no-results">Sin resultados</p>';return;}
  const shown=matches.slice(0,50);
  results.innerHTML=`<p class="result-count">${matches.length} resultado${matches.length!==1?'s':''}</p>`+
    shown.map(d=>`<div class="result-item"><div class="result-main"><strong>${d.artist}</strong> <span class="album">- ${d.album}</span>${d.genres.length?`<div class="result-genres">${d.genres.slice(0,4).join(' · ')}</div>`:''}</div><div class="result-year">${d.year||'—'}</div></div>`).join('');
}
