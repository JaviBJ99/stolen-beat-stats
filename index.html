<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Stolen Beat · Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0d0d; --text:#f0f0f0; --muted:#777; --red:#b03020; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:1.2rem; padding:2rem 1rem; text-align:center; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  h1 { font-family:'Big Shoulders Display','Arial Narrow',sans-serif; font-weight:800; line-height:1;
       font-size:clamp(2.6rem,12vw,5rem); letter-spacing:.04em; text-transform:uppercase; }
  h1 span { color:var(--red); }
  p { color:var(--muted); font-size:1rem; }
  .soon { font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; color:var(--red); font-weight:600; }
  a { display:inline-block; margin-top:.6rem; background:var(--red); color:#fff; text-decoration:none;
      border-radius:6px; padding:8px 18px; font-size:.85rem; font-weight:600; }
  a:hover { opacity:.85; }
  footer { position:absolute; bottom:1.2rem; font-size:.75rem; color:var(--muted); }
</style>
</head>
<body>
  <h1>The Stolen <span>Beat</span></h1>
  <div class="soon">Coming soon</div>
  <p>One album a day. The full archive, with stats and search, is on its way.</p>
  <a href="https://t.me/thestolenbeat" target="_blank" rel="noopener">Join on Telegram</a>
  <footer>© The Stolen Beat · 2026</footer>
</body>
</html>
